      { id:"7.1", title:"Cue Preview in Headphones", duration:"10 min", tag:"hands-on", html:`
        <h1>Cue Preview in Headphones</h1>
        <div class="meta">
          <span class="meta-item">Lesson 7.1</span>
          <span class="meta-item">~10 min</span>
          <span class="tag tag-hands-on">Hands-On</span>
        </div>
        <div class="expert-take"><p>The ability to hear a track in your headphones before the room hears it is one of the most powerful tools in DJing. It's the difference between making decisions under pressure and making decisions with information.</p></div>

        <h2>How Cue Works on Your Rig</h2>
        <p>Your Scarlett 4i4 has two independent stereo outputs: outs 1/2 go to the Edifiers (master — what the room hears). Outs 3/4 go to your Bose headphones (cue bus — what only you hear).</p>
        <p>In Ableton, each track has a <strong>Solo/Cue</strong> button (headphone icon). When Ableton's mixer is in <strong>Cue mode</strong> (the Solo button shows "C" instead of "S"), pressing solo on any track routes that track's audio to outs 3/4 only — your headphones. The master mix on outs 1/2 continues playing unchanged.</p>

        <h2>Set Up Cue Mode</h2>
        <div class="step-block">
          <div class="step-title">Configure and Test Cue</div>
          <ol>
            <li>In Ableton: <strong>Preferences → Audio → Output Config</strong> — confirm channels 1/2 and 3/4 are enabled.</li>
            <li>Set <strong>Master → Audio To: Out 1/2</strong> and <strong>Cue Out: Out 3/4</strong>.</li>
            <li>In the Ableton mixer, find the Solo button (on any track). Click it once. If the meter labels turn orange with an "S", it's in Solo mode. Click the "S" label to toggle to Cue mode (it becomes "C"). In Cue mode, soloing routes to headphones instead of muting other tracks.</li>
            <li>Start playing track A's stems through the master. Put your headphones on.</li>
            <li>Solo track B's drums (press the headphone/solo icon on that track). You should hear track B's drums in your headphones, while track A's full mix keeps playing through the speakers.</li>
            <li>This is cue preview — hearing what's next before committing it.</li>
          </ol>
        </div>

        <h2>The Workflow</h2>
        <p>In a real set: you're playing track A for the room. In your headphones, you're listening to track B's intro — making sure the tempo feels right (it does — Ableton synced it), listening to the key (does it clash? check Camelot on the app), previewing the energy level. Once you're confident B is the right call, you un-solo it and start the transition.</p>
        <p>This is the "preview before committing" workflow. It removes the guessing from transitions.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You've confirmed Ableton is in Cue mode (not Solo mode)</li>
            <li>You can hear a soloed track in headphones while the master keeps playing through speakers</li>
            <li>You've auditioned a "next track" in headphones and made a go/no-go decision before committing</li>
          </ul>
        </div>
      `},

      { id:"7.2", title:"The Three Clocks", duration:"10 min", tag:"concept", html:`
        <h1>The Three Clocks</h1>
        <div class="meta">
          <span class="meta-item">Lesson 7.2</span>
          <span class="meta-item">~10 min</span>
          <span class="tag tag-concept">Concept</span>
        </div>
        <div class="expert-take"><p>A DJ manages three time horizons simultaneously. Miss any one of them and something goes wrong — either the current moment sounds bad, the next moment isn't ready, or the set ends in the wrong place.</p></div>

        <h2>Clock 1 — NOW (0–8 bars)</h2>
        <p>This is what's playing right now. Your job: make it sound good. Are the faders balanced? Is the energy where it should be? Is a stem starting to feel repetitive? Do a micro-adjustment. This clock runs every bar.</p>

        <h2>Clock 2 — NEXT SWAP (5–60 seconds)</h2>
        <p>This is your upcoming transition. You should always know what track is coming next before you need it. Preview it in your headphones. Check its Camelot position in the app. Know which stems you'll fire first. By the time a transition starts, it should already be decided — you're just executing a plan you made 30 seconds ago.</p>

        <h2>Clock 3 — SET ARC (10–60 minutes)</h2>
        <p>This is the big picture: where is this set going? Are you building toward a peak? Are you past the peak and needing to bring energy down? How much time is left in the night? The arc clock runs on the scale of minutes, but you check it every few transitions.</p>

        <div class="diagram">CLOCK 1 — NOW           ← running right now, every bar
  "Does this sound good?"

CLOCK 2 — NEXT SWAP     ← 30 seconds ahead
  "What track comes next? Is it cued up?"

CLOCK 3 — SET ARC       ← 30 minutes view
  "Where am I in the set arc? Building? Peaked? Cooling?"</div>

        <h2>Managing Three Clocks Simultaneously</h2>
        <p>This is the hardest part of DJing and also the thing that creates flow state. When you're managing all three clocks smoothly, your attention cycles through them automatically: NOW → NEXT SWAP → ARC → NOW → NEXT SWAP → ARC. It's a rhythm within the music.</p>
        <p>Beginners usually collapse to Clock 1 only (just keeping the current thing sounding okay). Clock 2 awareness comes with practice. Clock 3 is what separates DJs who play 60-minute sets from DJs who play 20-minute sets that were supposed to be 60 minutes.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You can name the three clocks and their time horizons</li>
            <li>During a practice session, you consciously check all three — current sound, next track ready, set arc position</li>
            <li>You notice the moment when you "forget" Clock 2 (you reach a transition and haven't decided the next track yet)</li>
          </ul>
        </div>
      `},

      { id:"7.3", title:"Energy Arc", duration:"12 min", tag:"concept", html:`
        <h1>Energy Arc</h1>
        <div class="meta">
          <span class="meta-item">Lesson 7.3</span>
          <span class="meta-item">~12 min</span>
          <span class="tag tag-concept">Concept</span>
        </div>
        <div class="expert-take"><p>The energy arc is the shape of your set over time. Knowing how to design it separates DJs who can play one good transition from DJs who can control a room for 90 minutes.</p></div>

        <h2>Why Arc Matters</h2>
        <p>A set that's high energy all the way through is exhausting. A set that peaks too early and then fades is disappointing. A set with no arc at all is just a playlist. The arc is what makes a set feel like an <em>experience</em>.</p>
        <p>Different contexts require different arcs. An opening DJ set should start low and build slowly. A closing set needs a clear peak followed by a comedown. A peak-hour set might spike high and stay there, with micro-drops for breathing room. Know the context before you play.</p>

        <h2>A Standard 60-Minute Arc</h2>
        <div class="diagram">0–10 min:   INTRO — lower energy, crowd arriving, establishing the vibe
                Tracks: smoother, more stripped back, let the room find its feet

10–30 min:  BUILD — energy climbing, tempo can increase, more layers
                Transitions become tighter, combos more adventurous

30–45 min:  PEAK — maximum energy, your best drops, the moment
                Everything you've been building toward

45–55 min:  SUSTAIN — hold the peak with variation, crowd is deep in it
                Slight energy dips recover faster here (crowd is warmed up)

55–60 min:  RELEASE — let go, bring energy down gracefully
                Signals the experience is completing, not just stopping</div>

        <h2>Tools for Arc Control</h2>
        <p>Energy is controlled by: <strong>tempo</strong> (higher BPM = more energy), <strong>stem density</strong> (more stems playing = fuller, more intense), <strong>spectral content</strong> (bass-heavy = physical/lower, lots of high-end = bright/energetic), and <strong>vocal presence</strong> (vocals engage the crowd emotionally — use them strategically at peak moments).</p>
        <p>You have all of these controls via your faders. Bringing the bass fader up 6dB at the right moment is an energy spike. Removing the vocal stem is an energy micro-dip. These are your tools.</p>

        <h2>The AI Arc in Your App</h2>
        <p>The companion app's tail recs are scored against your current set's trailing arc — if you've been playing high-energy tracks, it recommends similarly high-energy options. If you've been building from chill, it suggests the next step up. You can use this to navigate the arc algorithmically. Or override it when you feel the room needs something different. The AI is a co-pilot, not the captain.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You can sketch a 60-minute arc (intro / build / peak / sustain / release) on a napkin</li>
            <li>You understand which stem moves increase energy (add bass, add density) vs. decrease it (remove stems, filter)</li>
            <li>You know that the tail recs in the app are scored against your arc — and that you can override them</li>
          </ul>
        </div>
      `},

    ]
  },

  // ══════════════════════════════════════════
  {
    title: "Part 8 · The Do Less Rule",
    lessons: [

      { id:"8.1", title:"Let It Breathe", duration:"8 min", tag:"concept", html:`
        <h1>Let It Breathe</h1>
        <div class="meta">
          <span class="meta-item">Lesson 8.1</span>
          <span class="meta-item">~8 min</span>
          <span class="tag tag-concept">Concept</span>
        </div>
        <div class="expert-take"><p>The biggest mistake stem DJs make is over-manipulation. You have 5 faders, a filter, and 8 rows of pads — it's tempting to touch all of them constantly. Don't. The music does most of the work. Your job is to get out of its way.</p></div>

        <h2>Why Stems Tempt Over-Manipulation</h2>
        <p>You have more control than any standard DJ setup. More control creates more temptation. Beginners often feel like they should be doing something every few bars — swapping a stem, moving a fader, applying a filter. The result: the mix sounds restless, chaotic, like nothing is allowed to settle.</p>
        <p>A crowd can't feel the groove if the groove keeps changing before they've locked into it. <strong>Let a combination breathe for 8–16 bars before you change anything.</strong></p>

        <h2>The Rule</h2>
        <p>After any stem swap or fader move: <strong>wait at least one full phrase (8 bars) before making the next move</strong>. Put your hands in your lap. Trust the music. Listen to how the room responds.</p>
        <p>Most of the time, you'll find the music sounds great without any intervention for longer than you expected. The impulse to "do something" is anxiety, not artistry.</p>

        <h2>Less Is More — The Confidence Signal</h2>
        <p>When you see a confident DJ stand still, arms crossed, for a full minute while the track plays, they're not being lazy — they're communicating: <em>I know this is exactly right, and I don't need to touch anything.</em> The crowd reads stillness as confidence. Frantic hands signal uncertainty, even if the mix sounds fine.</p>
        <p>The physical calm of a good DJ is part of the performance.</p>

        <h2>When to Break the Rule</h2>
        <p>The Do Less Rule doesn't mean "never move." It means: move with intention, then wait for the move to land. Breaking the rule is allowed when:</p>
        <ul>
          <li>Something has clearly gone wrong and needs immediate fixing</li>
          <li>You're deliberately layering multiple moves as a planned sequence (e.g., the 4-step stem crossfade)</li>
          <li>The energy in the room demands a faster response than 8 bars</li>
        </ul>
        <p>Even then: make the move, then wait. Don't make another move to "fix" the first one while it's still landing.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You can sit on a combination for a full 16 bars without touching anything — and enjoy it</li>
            <li>You recognize the anxiety-driven impulse to "do something" vs. the intentional decision to make a move</li>
            <li>Your transitions feel more deliberate and less frantic than when you first started</li>
          </ul>
        </div>
      `},

    ]
  },

  // ══════════════════════════════════════════
  {
    title: "Part 9 · Your Factory",
    lessons: [

      { id:"9.1", title:"Getting New Tracks", duration:"10 min", tag:"concept", html:`
        <h1>Getting New Tracks</h1>
        <div class="meta">
          <span class="meta-item">Lesson 9.1</span>
          <span class="meta-item">~10 min</span>
          <span class="tag tag-concept">Concept</span>
        </div>
        <div class="expert-take"><p>Your library is the foundation of everything. A great library makes great sets easy. A weak library makes great sets impossible, no matter how good your technique is.</p></div>

        <h2>The Only Source That Actually Works</h2>
        <p>You've already discovered (via painful experience) that Spotify's API restrictions, YouTube's anti-bot systems, and spotDL's rate-limiting make streaming-to-file pipelines unreliable. The one path that reliably works:</p>
        <p><strong>Buy tracks on Beatport.</strong> 320 kbps MP3 or AIFF. ~$2–3 per track. Instant download. No API nonsense. Drop the file in <code>~/Music/Dance/library/</code>, run <code>dance process</code>, done. Stems generated in ~5 minutes per track on your M2 Pro.</p>

        <h2>Building a Library You Can Mix</h2>
        <p>The common beginner mistake: buying too many tracks across too many genres. A library of 500 tracks across 10 genres is harder to mix than a library of 100 tracks within 2 genres. Within-genre compatibility (key, tempo, energy) is much higher — the AI recommendations are stronger, the harmonic matches are more reliable, and you know your library better.</p>
        <p>Start tight. Your current ~66 tracks is a good seed. Expand within 2 genres you know and love before branching out. Add 5–10 tracks per session, not 50. Give each new track time to find its place in your mental map.</p>

        <h2>Where to Discover Tracks</h2>
        <ul>
          <li><strong>Beatport charts</strong> — top 10 in your genre this week. High-quality curation, DJ-focused.</li>
          <li><strong>SoundCloud (free):</strong> many producers upload full tracks. Download if the option is available.</li>
          <li><strong>Bandcamp:</strong> independent artists, often FLAC/WAV quality, fair pricing.</li>
          <li><strong>Radio shows / mixes:</strong> Boiler Room, Resident Advisor, NTS. Shazam anything you want. Then buy on Beatport.</li>
          <li><strong>Your own production (future):</strong> if you produce, your originals become part of the library. The pipeline handles them identically.</li>
        </ul>

        <h2>The Crate Dig Habit</h2>
        <p>Professional DJs "dig" for tracks constantly — it's not a monthly chore, it's a weekly practice. 30 minutes per week on Beatport's new releases in your genre. Buy 2–3 tracks max. Process them. Add them to a "new material" practice set. Play with them for a week before deciding if they stay. This is the habit that keeps a library alive.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You've bought at least 3 tracks on Beatport and added them to your library</li>
            <li>You understand why depth in 1–2 genres beats breadth across 10</li>
            <li>You have a weekly "crate dig" habit (even 20 minutes counts)</li>
          </ul>
        </div>
      `},

      { id:"9.2", title:"What the Pipeline Does", duration:"12 min", tag:"concept", html:`
        <h1>What the Pipeline Does</h1>
        <div class="meta">
          <span class="meta-item">Lesson 9.2</span>
          <span class="meta-item">~12 min</span>
          <span class="tag tag-concept">Concept</span>
        </div>
        <div class="expert-take"><p>Understanding what the pipeline does gives you two things: the ability to diagnose when something is wrong, and the ability to trust the data it produces. Both matter at 2am when something isn't working.</p></div>

        <h2>The Pipeline is a State Machine</h2>
        <p>Every track in the database has a <strong>state</strong>. The pipeline advances tracks through states in sequence. You can see states in the companion app's Pipeline view, or via <code>dance status</code> in the terminal.</p>

        <div class="diagram">pending
  → analyzed       (BPM, key, RMS detected on full mix)
  → separated      (Demucs ran: 4 stems extracted)
  → stems_analyzed (BPM, RMS, key detected per stem)
  → regions_detected (cues, loops, drops, outros mapped)
  → complete       (CLAP embeddings computed, track edges built)

error             (something failed — see the Pipeline view for why)</div>

        <h2>What Each Stage Produces</h2>
        <p><strong>analyze:</strong> BPM, musical key, RMS levels, beat grid. This is the first data the companion app uses.</p>
        <p><strong>separate:</strong> The Demucs separation — 4 stems as audio files. Takes 1–3 minutes per track on M2 Pro. This is the slowest stage.</p>
        <p><strong>analyze_stems:</strong> Same analysis as above, but run on each stem individually. Bass key, drum presence, vocal RMS.</p>
        <p><strong>detect_regions:</strong> Finds intro, outro, drop, breakdown, cue points by analyzing energy + spectral patterns. This is what populates your cue markers.</p>
        <p><strong>embed:</strong> CLAP model computes a vector embedding of the full mix + each stem. These vectors power the semantic "sounds similar" recommendations.</p>
        <p>After all tracks reach <strong>complete</strong>: run <code>dance build-graph</code> to recompute the recommendation graph. Then run <code>dance export-als --all</code> to generate fresh .als files for Ableton.</p>

        <h2>The Full Workflow (After Adding New Tracks)</h2>
        <div class="step-block">
          <div class="step-title">New Track Workflow</div>
          <ol>
            <li>Drop audio files into <code>~/Music/Dance/library/</code></li>
            <li><code>dance process</code> — runs all pipeline stages until every track is complete</li>
            <li><code>dance tag</code> — CLAP zero-shot tagging (~50ms/track, fast)</li>
            <li><code>dance build-graph</code> — rebuilds the recommendation graph</li>
            <li><code>dance export-als --all</code> — generates new .als files</li>
            <li>Open new .als in Ableton (or reload current session if already open)</li>
          </ol>
        </div>

        <h2>When Something Is in "error" State</h2>
        <p>Open the companion app → Pipeline view. Filter for "error" tracks. Click any error track to see the error message. Common causes: audio file is corrupt or in an unsupported format; Demucs ran out of memory (try <code>dance process --skip-stems</code> to see if other stages work); key detection failed on an unusual track. Most errors are fixable by checking the file and retrying.</p>

        <div class="win-block">
          <div class="win-label">You Got It When</div>
          <ul>
            <li>You can list the 5 pipeline stages and describe what each one produces</li>
            <li>You know the full post-ingest workflow: process → tag → build-graph → export-als</li>
            <li>You know how to find and diagnose error-state tracks in the Pipeline view</li>
          </ul>
        </div>
      `},

    ]
  },

];

// ─────────────────────────────────────────────
//  APP STATE
// ─────────────────────────────────────────────

const ALL_LESSONS = COURSES.flatMap(c => c.lessons);
const TOTAL = ALL_LESSONS.length;

let currentIdx = 0;
let completed = new Set(JSON.parse(localStorage.getItem('dance_course_v1') || '[]'));

function save() {
  localStorage.setItem('dance_course_v1', JSON.stringify([...completed]));
}

// ─────────────────────────────────────────────
//  SIDEBAR
// ─────────────────────────────────────────────

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let html = '';
  COURSES.forEach((course, ci) => {
    const hasCurrent = course.lessons.some((_, li) => {
      const absIdx = ALL_LESSONS.findIndex(l => l.id === course.lessons[li].id);
      return absIdx === currentIdx;
    });
    html += `<div class="course-group">
      <div class="course-label ${hasCurrent ? 'has-current' : ''}" onclick="toggleCourse(${ci})">
        <span>${course.title}</span>
        <span class="arrow" id="arrow-${ci}">▼</span>
      </div>
      <div class="lesson-list" id="course-${ci}">`;
    course.lessons.forEach(lesson => {
      const absIdx = ALL_LESSONS.findIndex(l => l.id === lesson.id);
      const isCurrent = absIdx === currentIdx;
      const isDone = completed.has(lesson.id);
      html += `<div class="lesson-row ${isCurrent ? 'current' : ''} ${isDone && !isCurrent ? 'done' : ''}" onclick="jumpTo(${absIdx})">
        <span class="row-check">${isDone ? '✓' : '○'}</span>
        <span class="row-num">${lesson.id}</span>
        <span class="row-title">${lesson.title}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  nav.innerHTML = html;

  // Auto-open course containing current lesson
  COURSES.forEach((course, ci) => {
    const hasCurrent = course.lessons.some(l => ALL_LESSONS.findIndex(x => x.id === l.id) === currentIdx);
    const list = document.getElementById(`course-${ci}`);
    if (hasCurrent || ci === 0) {
      list.classList.remove('hidden');
      document.getElementById(`arrow-${ci}`).style.transform = '';
    } else {
      list.classList.add('hidden');
      document.getElementById(`arrow-${ci}`).style.transform = 'rotate(-90deg)';
    }
  });

  // Update progress
  const pct = Math.round((completed.size / TOTAL) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${completed.size} of ${TOTAL} lessons complete`;
}

function toggleCourse(ci) {
  const list = document.getElementById(`course-${ci}`);
  const arrow = document.getElementById(`arrow-${ci}`);
  if (list.classList.contains('hidden')) {
    list.classList.remove('hidden');
    arrow.style.transform = '';
  } else {
    list.classList.add('hidden');
    arrow.style.transform = 'rotate(-90deg)';
  }
}

// ─────────────────────────────────────────────
//  CONTENT
// ─────────────────────────────────────────────

function renderContent() {
  const lesson = ALL_LESSONS[currentIdx];
  document.getElementById('content').innerHTML = lesson.html;
  document.getElementById('content-wrap').scrollTop = 0;

  const isDone = completed.has(lesson.id);
  const btn = document.getElementById('complete-btn');
  const isLast = currentIdx === TOTAL - 1;

  if (isDone) {
    btn.textContent = isLast ? '✓ Complete' : '✓ Done';
    btn.classList.add('already-done');
  } else {
    btn.textContent = isLast ? 'Mark Complete' : 'Done → Next';
    btn.classList.remove('already-done');
  }

  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('next-btn').disabled = currentIdx === TOTAL - 1;

  document.title = `${lesson.id} · ${lesson.title} — Dance Course`;
}

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────

function go(dir) {
  const next = currentIdx + dir;
  if (next < 0 || next >= TOTAL) return;
  currentIdx = next;
  renderSidebar();
  renderContent();
}

function jumpTo(idx) {
  currentIdx = idx;
  renderSidebar();
  renderContent();
}

function markDone() {
  const lesson = ALL_LESSONS[currentIdx];
  const wasDone = completed.has(lesson.id);
  if (!wasDone) {
    completed.add(lesson.id);
    save();
  }
  if (currentIdx < TOTAL - 1) {
    currentIdx++;
  }
  renderSidebar();
  renderContent();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────

function findStart() {
  for (let i = 0; i < ALL_LESSONS.length; i++) {
    if (!completed.has(ALL_LESSONS[i].id)) return i;
  }
  return 0;
}

currentIdx = findStart();
renderSidebar();
renderContent();
</script>
